<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTCG 台灣即時排名與積分試算系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#151e32',
              900: '#0f172a',
              950: '#090d16',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500/30 selection:text-amber-200">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center shadow-lg shadow-amber-500/20">
          <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-black tracking-tight text-lg text-white">PTCG 台灣即時排名</span>
            <span class="hidden sm:inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30">2026-27 賽季</span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block">雲端資料庫同步 × 獨立試算引擎</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="adminToggleBtn" onclick="toggleAdminMode()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500/15 hover:bg-amber-500/25 text-amber-400 border border-amber-500/40 transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          <span id="adminBtnText">管理員手動調整</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">

    <!-- 狀態列與資料同步資訊 -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-900/70 border border-slate-800 rounded-2xl px-4 py-3 text-xs">
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
        <span class="flex items-center gap-1.5 font-medium text-emerald-400">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="syncStatusText">準備連線 Google Sheets 雲端資料庫...</span>
        </span>
        <span class="text-slate-400">最後同步時間：<strong id="lastFetchTime" class="text-slate-200 font-mono-num">—</strong></span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchFromGoogleSheets()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium border border-slate-700 transition flex items-center gap-1.5 active:scale-95">
          <svg id="refreshIcon" class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          重新讀取雲端資料
        </button>
      </div>
    </div>

    <!-- 頂部數據摘要卡片 (KPI Cards) -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4">
        <div class="text-xs text-slate-400 mb-1">目前檢視組別</div>
        <div id="kpiDivisionName" class="text-xl sm:text-2xl font-black text-white">孩童組 (Junior)</div>
        <div class="text-[11px] text-slate-500 mt-1">切換下方頁籤即時更新</div>
      </div>

      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4">
        <div class="text-xs text-slate-400 mb-1">排行榜總人數</div>
        <div class="flex items-baseline gap-1.5">
          <span id="kpiTotalPlayers" class="text-xl sm:text-2xl font-black text-sky-400 font
